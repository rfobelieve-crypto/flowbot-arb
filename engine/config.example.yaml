# entropy-arb strategy configuration / 策略配置
#
#   cp config.example.yaml config.yaml     then edit / 复制后修改
#
# This file IS the strategy. Credentials never live here — they go in .env
# (see .env.example). Every key is validated: a typo is a startup error, not
# a setting that silently does nothing.
# 本文件就是策略本身。密钥绝不放在这里（见 .env.example）。所有键名都会被校验：
# 拼写错误会直接报错，而不是静默失效。
#
# WHICH MARKETS to trade is NOT in this file — you state it explicitly on
# every start with command-line flags:
#     python3 main.py --symbol SNDK --hedge lighter-rh
# Entropy is always one leg; --hedge picks the other:
#   lighter      Lighter mainnet            (USDC, 0 bps taker)
#   lighter-rh   Lighter Robinhood chain    (USDG, 0 bps taker)
#   tradexyz     Hyperliquid trade.xyz dex  (USDC, ~1 bps taker)
# 交易哪个市场不在本文件中配置——每次启动时用命令行参数显式指定：
#     python3 main.py --symbol SNDK --hedge lighter-rh
# Entropy 永远是其中一条腿；--hedge 选择对冲腿（三选一，见上表）。

# ============================ THE SIGNAL / 信号 ============================
# premium_bps = (Entropy price / hedge price - 1) * 10000
#
#   SELL entropy + BUY hedge   when executable premium >= midline + upper
#   BUY entropy + SELL hedge   when executable premium <= midline - lower
#
# Both hurdles are net of taker fees (the engine adds fees on top), so one
# full round trip nets >= upper + lower bps after fees by construction.
#
# midline_bps is a number YOU derive from recorded data. Run the bot
# (--record-only) to collect logs/minutes.csv, then:  python3 tools/analyze.py
#
# midline_bps 是你根据采集数据设定的值。先运行机器人（--record-only）采集
# logs/minutes.csv，再运行 python3 tools/analyze.py 获取建议值。
# 两个方向的门槛都已扣除手续费（引擎会在此之上另加手续费），因此一次完整往返
# 扣费后净赚 >= upper + lower bps。
thresholds:
  midline_bps: 0.0     # persistent premium center / 溢价长期中枢
  upper_bps: 4.0       # entry above midline: sell entropy / 中枢上方入场带宽
  lower_bps: 4.0       # entry below midline: buy entropy / 中枢下方入场带宽

# ======================== VENUES / 交易所参数 ==============================
entropy:
  dex: io                    # Entropy's dex name on Hyperliquid / Entropy 的 dex 名
  taker_fee_bps: 0.0         # taker fee / 吃单手续费
  # B3: the MAKER fee, which is a different number and the entire reason the
  # maker path exists. May be negative where the venue pays a rebate.
  # Defaults to taker_fee_bps, never to zero: a fee schedule you have not
  # verified on a real receipt is not a discount, it is a guess.
  # 挂单手续费（可为负＝返佣）。未填则默认等于吃单费——没有对过帐单的费率
  # 不能当成折扣。
  maker_fee_bps: 0.0
  max_position_usd: 1000     # position cap / 持仓上限（美元）
  max_orders_per_min: 120    # order-send budget, sliding 60s / 每分钟下单预算

hedge:
  taker_fee_bps: 0.0         # Lighter venues: 0; tradexyz: ~1.0
  maker_fee_bps: 0.0
  max_position_usd: 1000
  max_orders_per_min: 30     # Lighter's ceiling is ~40/min / Lighter 上限约 40/分钟

# ==================== CONTROL CHANNEL / 控制通道 ===========================
# B5 (2026-09-04). Four verbs, applied from OUTSIDE the process:
#   /pause   stop opening new exposure. Hedging, flattening, self-rescue and
#            reconcile continue, and no position is closed.
#   /resume  lift the pause. It CANNOT lift a HALT — a halt needs a restart,
#            because the restart is what re-reads real positions strictly.
#   /flat    close everything and STAY paused. Positions are verified against
#            the venues BEFORE anything is closed.
#   /status  read-only.
# Every verb is idempotent. The channel does not go through the dashboard,
# because it has to work on the day the dashboard is what broke: Telegram
# (credentials in .env) plus a command file you can echo into over SSH.
# 四个动词，进程外下达，每个都幂等：pause 只停开仓不平仓；resume 不能解除
# HALT；flat 先对帐核实真实持仓再平，平完仍保持暂停；status 只读。
# 不经过仪表板——仪表板挂掉的那天它必须还能用。
control:
  enabled: true
  # one verb per line; the file is emptied as it is read, so a stale verb
  # cannot re-fire after a restart / 一行一个动词，读完即清空
  command_file: control.cmd
  poll_sec: 2.0
  # relay CRITICAL log lines (HALT, self-rescue, unresolved maker orders,
  # volatility pauses) to the same channel — the difference between a guard
  # that fired and a guard you find out about tomorrow
  # 把 CRITICAL 日志转发到同一个通道：守卫触发了要当场看得见
  notify_critical: true

# ========================= SIZING / 下单规模 ===============================
sizing:
  take_fraction: 0.5           # fraction of crossable depth to take / 吃掉可套利深度的比例
  max_order_notional_usd: 500  # per-slice cap / 单笔名义上限
  min_order_notional_usd: 10   # skip dust / 低于此名义不下单

# ==================== INVENTORY LADDER / 库存阶梯 ==========================
# Extra bps required once a venue's position passes floor_frac of its cap in
# the adding direction — ramps linearly to scale_bps at 100% of the cap.
# Slows down one-sided accumulation without hard-stopping the strategy.
# 当某交易所持仓超过上限的 floor_frac 后，同方向继续加仓需额外溢价，线性增加到
# 满仓时的 scale_bps。避免单边持仓快速堆满。 scale_bps: 0 disables / 0 为关闭。
inventory:
  scale_bps: 10.0
  floor_frac: 0

# ======================= EXECUTION / 执行参数 ==============================
execution:
  # ---- B3 maker path (2026-09-04) ----------------------------------------
  # taker: both legs are IOC, sent together (the original behaviour, and the
  #        default -- every config written before B3 loads unchanged).
  # maker: ONE leg rests as a post-only order and whatever fills is hedged
  #        with an IOC on the other venue. COST_INVENTORY puts the taker
  #        hurdle at 13.5 bps and the maker hurdle at 4.5 bps, which is why
  #        this exists; it is also strictly harder to get right, because the
  #        exchange owns the truth about our position for as long as the
  #        quote rests.
  # taker：两条腿同时 IOC（原有行为，默认值）。maker：一条腿挂 post-only，
  # 成交多少就在另一所对冲多少。挂单门槛 4.5 bps vs 吃单 13.5 bps。
  mode: taker
  maker_venue: entropy       # which leg rests / 哪条腿挂单（entropy | hedge）
  maker_timeout_sec: 5.0     # quote lifetime before cancel / 挂单存活时间
  # The cancel gets its OWN budget, deliberately separate from staleness_sec
  # and from the quote's lifetime. A cancel unconfirmed past this is treated
  # as POSSIBLY FILLED -- never as cancelled (PEER_INFRA.md S7 must #3).
  # 撤单有独立的时间预算；超时未确认一律当作「可能已成交」，不是「已撤」。
  cancel_timeout_sec: 3.0
  maker_poll_sec: 0.25       # how often a resting order is read / 挂单轮询间隔
  # Cancel a resting quote once its edge, measured against the CURRENT hedge
  # book and net of both fees, falls below this. 0 = pull it the moment the
  # trade would lose money. Raise it to leave more cushion for the round trip.
  # 挂单的边际（按当前对冲盘口、扣两边手续费）低于此值即撤单；0 = 一旦会亏
  # 就撤。
  maker_min_edge_bps: 0.0
  # ------------------------------------------------------------------------
  premium_persist_sec: 0     # edge must persist this long before firing / 信号需持续时间
  cooldown_sec: 0.0            # min gap between executions / 两次执行的最小间隔
  settle_timeout_sec: 10.0      # wait for fill confirmation / 等待成交确认
  leg_slippage_bps: 50.0       # taker limit protection per leg / 每腿滑点保护
  hedge_slippage_bps: 20.0     # price protection on delta hedges / 对冲滑点保护
  net_tolerance_base: 0.001    # max tolerated net delta (base units) / 允许的净敞口
  max_consecutive_errors: 3    # halt after N straight failures / 连续失败 N 次后停机
  rate_limit_pause_sec: 10.0   # pause a 429'd venue this long / 被限频后的暂停时长
  staleness_sec: 10.0          # a feed older than this is stale / 行情超时判定
  reconcile_sec: 15.0          # on-chain position sync cadence / 链上持仓核对周期
  venue_probe_sec: 30.0        # probe cadence for a down venue / 故障交易所探测周期
  http_keepalive_sec: 10.0     # keep order-path TLS warm; 0 = off / 订单链路保活

# ================== DATA RECORDER / 数据采集 ===============================
# Always-on while the bot runs: samples both real order books 1/sec and
# writes one CSV row per minute. This is the input for tools/analyze.py.
# 机器人运行期间自动开启：每秒采样两边真实盘口，每分钟写一行 CSV，
# 供 tools/analyze.py 分析并设定上方 thresholds。
recorder:
  enabled: true
  csv: logs/minutes.csv

# ==================== LOGGING & DASHBOARD / 日志与仪表盘 ====================
# On a terminal the bot shows a live Rich dashboard (books, signal, positions,
# PnL, recent executions); log lines then go to `file` instead of the console.
# Off-terminal runs (nohup/systemd) fall back to plain console logs
# automatically; --no-dashboard forces that.
# 在终端运行时显示实时 Rich 仪表盘（盘口、信号、持仓、盈亏、最近成交），
# 日志写入 `file` 而不再打印到屏幕。非终端环境（nohup/systemd）自动退回
# 纯日志模式；也可用 --no-dashboard 强制关闭。
logging:
  level: INFO
  status_interval_sec: 30.0
  trades_csv: logs/trades.csv
  # B3: resting quotes get their own file — rest time, fill vs cancel, cancel
  # latency and the hedge lag have no meaning for an IOC pair. This is the
  # direct input to LIVE_50U_SPEC M2 (fill rate) and M4 (two-leg latency).
  # Defaults to maker.csv beside trades_csv.
  # 挂单执行单独记一份：挂单存活时间、成交/撤单、撤单延迟、对冲延迟。
  maker_csv: logs/maker.csv
  # --shadow writes every decision it did NOT send here. Shadow is the step
  # between --record-only (no strategy at all) and real money; it is NOT a
  # paper mode — no fill is simulated, no position invented, no PnL claimed.
  # 影子模式把「本来会送出的每一个决定」写在这里。它不是模拟盘：不模拟成交、
  # 不虚构持仓、不宣称损益。
  shadow_csv: logs/shadow.csv
  dashboard: true
  file: logs/engine.log

# B4/G1 risk switch (2026-09-04): largest |legA + legB| the engine may carry
# before it HALTS outright. The two legs are supposed to cancel; if they stop
# cancelling, the trade is no longer an arbitrage. Default = 3x
# execution.net_tolerance_base. Set 0 to disable (not recommended live).
# 两条腿本应相互抵消；差额超过此值即整机停止下单。默认 = 3 倍
# execution.net_tolerance_base；设 0 关闭（实盘不建议）。
risk:
  max_net_base: 0.003
  # Session mark-to-market floor in USD. The engine halts when session PnL
  # drops below -this. 0 disables (not recommended live).
  # 本次运行的 MTM 亏损下限（USD），超过即整机停止下单；0 关闭。
  max_daily_loss_usd: 20.0
  # Absolute ceiling on sum |position x mid| across BOTH venues. cap_usd is
  # per-venue, so this is the backstop for a config typo. 0 disables.
  # 两条腿名目金额合计上限；cap_usd 是逐场馆的，这一条是设定打错时的兜底。
  max_gross_usd: 400.0
  # Books stale this many evaluations in a row -> halt. A dead feed and a
  # quiet market look identical without this. 0 disables.
  # 连续 N 次盘口过期即停机——没有这条，行情安静和数据源死掉长得一样。
  max_consecutive_stale: 20
  # What happens when that limit is reached depends on whether there is
  # anything to protect. HOLDING something -> HALT (you cannot manage a
  # position you cannot see). FLAT -> pause and recover by itself, because
  # "stop trading" is already fully achieved by the per-evaluation freshness
  # check and the extra halt only costs a restart. Measured 2026-09-05: a
  # websocket dropped, the guard halted, the feed returned eight seconds
  # later, and the engine sat halted for two hours with nothing at risk.
  # This is the backstop for that leniency: a feed that dies this many times
  # in ONE session is a systemic problem and halts even flat. 0 = never.
  # 盘口过期达到上限时：有持仓 -> 停机；持仓为零 -> 暂停并自行恢复。
  # 但同一场次死这么多次就是系统性问题，即使空仓也停机。
  max_stale_episodes: 5
  # Self-rescue: consecutive reduce-only hedge attempts that make NO PROGRESS
  # before backing off to a slow retry. Any reduction in |net| resets it, so a
  # transient outage cannot exhaust it. The engine NEVER gives up permanently
  # -- after the budget it retries every 20 reconcile cycles. 0 = freeze
  # (leaves naked exposure; opt in only if you will flatten by hand).
  # 自救：连续「毫无进展」的 reduce-only 对冲次数上限；|net| 只要变小就重置，
  # 所以短暂断线不会耗尽它。用完之后改为每 20 个对帐周期重试一次，永不永久放弃。
  # 设 0 = 冻结（留下裸露，除非你会手动平仓否则不要设）。
  halt_flatten_attempts: 3
  # Ceiling on the top-of-book premium the engine will act on. Measured bands
  # on this family are 2-15 bps, so a reading in the hundreds means the BOOK is
  # wrong (halted/delisted underlying, persistent bad tick, oracle break), not
  # that the market is generous. Skipped, not halted. 0 disables.
  # 价差上限：本家族实测带宽 2-15 bps，读到几百 bps 意味着盘口错了（标的停牌/
  # 下市、持续坏点、预言机断线），不是市场慷慨。只跳过不停机；设 0 关闭。
  max_edge_bps: 150.0
  # ---- volatility circuit breaker (2026-09-04) ---------------------------
  # The largest peak-to-trough move, in bps, that either venue's mid may make
  # inside vol_window_sec before the engine stops opening NEW exposure for
  # vol_cooldown_sec. Every other switch above is one-way and needs a
  # restart; this one is a PAUSE and lifts itself, because volatility fixes
  # itself and a breaker that needs a human after every news spike gets
  # switched off. Hedging, flattening, self-rescue and reconcile are NEVER
  # paused — refusing to open during a storm while also refusing to close is
  # the worst of both. A resting maker quote is pulled immediately.
  # It measures RANGE, not standard deviation: what costs money is how far
  # the price travelled between reading the book and the second leg filling,
  # and a single jump inside an otherwise quiet window is exactly the shape a
  # standard deviation averages away.
  # Pick it from recorded minute data: comfortably above the instrument's
  # ordinary 30-second range, well below a news move. 0 disables, and live
  # trading refuses to start while it is 0.
  # 波动熔断：任一交易所中价在 vol_window_sec 内的最大波峰-波谷幅度（bps），
  # 超过即暂停开新仓 vol_cooldown_sec 秒。这是唯一会自动恢复的开关；对冲、
  # 平仓、自救、对帐永不暂停，挂单会立刻撤回。用录制的分钟数据挑这个值：
  # 明显高于平时的 30 秒波幅，明显低于新闻行情。0 = 关闭，且实盘会拒绝启动。
  vol_window_sec: 30.0
  vol_max_move_bps: 40.0
  vol_cooldown_sec: 60.0
