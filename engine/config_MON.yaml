# MON —— HMM 候選（2026-09-14 由 arblib/make_hmm_config.py **從量測生成**）
#
# **不要用複製的方式改這份檔。** 下面每一個價格相依的數字都是從當天的
# 價格與步長算出來的；複製到另一個標的上它們全部失去意義,而且不會報錯。
# 換標的請重跑產生器（mistake.md 2026-09-14）。
#
# 生成當下的量測：
#   Lighter MON   價格 0.02338   步長 0.1 顆   日成交額 $139,090
#   HL MON      價格 0.023412   步長 1 顆   maxLeverage 5x
#   價格偏離 0.14%（>5% 就是同名不同資產,不是溢價）
#   一張單 $15 = 641.574 顆｜殘餘量子 1 顆 = $0.0234

entropy:                      # 吃單對沖腿
  dex: ''
  # **這一腿的 symbol 不在這裡,在 `--symbol`。** config.py:591 對 HL 腿寫的是
  # `symbol=symbol`（CLI 的那個）—— 寫在 YAML 裡的 `entropy.symbol` 會被
  # schema 接受、解析成功,然後**安靜地忽略**。所以啟動器用 `--symbol MON`,
  # 而掛單腿的 MON 寫在下面的 `hedge.symbol`。
  # （ANTH 一直是這個形狀：--symbol ANTH ＋ hedge.symbol: ANTHROPIC。）
  # 2026-09-14 用 `userFees`（帶 dex 參數）逐池查證：core / io / para / xyz
  # **四個池的費率完全相同** —— cross 0.00045 / add 0.00015。
  # perpDexs 的 `feeRecipient` 是從基礎費裡**分成**,不是外加。
  taker_fee_bps: 4.5
  maker_fee_bps: 1.5
  max_position_usd: 60
  max_orders_per_min: 30

hedge:                        # 掛單腿（execution.maker_venue: hedge）
  symbol: MON
  taker_fee_bps: 2.8          # Lighter PREMIUM
  maker_fee_bps: 0.4          # ← 這條腿掛單,這才是我們實際付的
  max_position_usd: 60
  max_orders_per_min: 60

thresholds:
  # **候選之間刻意保持一致。** G2（兩側可做性）直接受它影響 ——
  # 換一個門檻就換一個答案,所以要比較候選，這三行不可以逐標的調。
  midline_bps: 0.0
  upper_bps: 3.0
  lower_bps: 3.0

sizing:
  take_fraction: 0.5
  # 維持 15 而理由不是深度：對沖腿實測吃得下三十到四十倍
  # （GMX bid 中位 $819 / MET $516,自己中價 5 bps 內）。
  # 綁束是 M2（成交率）與 M3（逆選擇）都還沒量 —— 它們才是每張單的真實
  # 成本。放大一個還沒量過的東西不是放大收益。
  max_order_notional_usd: 15
  min_order_notional_usd: 10   # 場館下限 $10.00

inventory:
  scale_bps: 10.0
  floor_frac: 0
  # **MON 是第一個開折讓的設定（2026-09-14）,而它是為了一個算得出來的
  # 數字開的,不是「試試看」。**
  #
  # 兩側檢驗（arblib/hmm_universe.py）量到 MON:
  #     賣側 +8.69 bps   買側 +2.29 bps   基差 +3.20
  # 買側是**正的**,只是低於 band（upper_bps 3.0）0.71 bps。所以沒有折讓的
  # 話,引擎只報賣側 -> 庫存單向堆到 $60/腿 -> 停住。XPL 就是這樣死的
  # （報價側別 332:0、十分鐘 95 次 blocked by position caps）,差別是 XPL
  # 的買側是 **-6.47**，怎麼折讓都救不回來,而 MON 只差 0.71。
  #
  # 折讓 = relief_frac x scale_bps x u（floor_frac 0,所以從 0 就開始長）。
  # 要在庫存 u 時讓買側門檻降到 2.29:
  #     0.1 x 10 x u >= 0.71   ->   u >= 0.71
  # 也就是**庫存到七成上限時買側開火**,然後它自己穩在那裡。
  #
  # **可否證的預測**:MON 的庫存會在約 0.7 x $60 = $42 /腿 附近來回,
  # 不會像 XPL 那樣貼在上限。如果它照樣貼上限,是這個機制沒作用,查它。
  relief_frac: 0.1
  # 地板 0.0 = 扣完費用剛好打平。這裡不會碰到（買側 +2.29 > 0）,留著是
  # 因為它擋的是「庫存壓力大到讓引擎自動虧錢平倉」那條路。
  min_threshold_bps: 0.0

execution:
  mode: maker
  maker_venue: hedge
  # 20.0 -> 60.0（2026-09-15）。**舊值設在成交時間分布的中位數以下。**
  #
  # Quant Arb `2026-05-27 analysing-real-fills`（35,107 筆真實掛單成交，
  # colocated 東京 AWS、Binance 前 50）量到「下單被接受 -> 成交」:
  #     中位 **27.3 秒**   p90 **244.7 秒**
  # 而我們的逾時是 20 秒 —— 在他的中位數以下。他的條件（流量、延遲）
  # 每一項都比 MON 好，薄市場只會更慢。
  #
  # **而我們自己的資料看不到這件事,因為它被這個參數截斷了**:
  #     我們的時間到成交 中位 10.8 秒、p90 16.9、**最大 19.8**
  # 最大值卡在 20 不是巧合。所有會在 25 秒、60 秒、200 秒成交的單,
  # 我們在 20 秒就撤掉了 —— 它們從來不會進入樣本。這是倖存者偏誤,
  # 而「繼續累積」修不了它:再累積一年,最大值還是 19.8。
  #
  # **為什麼這個改動不用拿邊際去換**（其他提高頻率的手段都要）:
  # 邊際每 maker_poll_sec（0.05 秒）重算一次,`edge decayed`（佔撤單 45%）
  # 與 `behind the touch`（33%）照樣會把壞掉的單拉走。逾時是第三條更鈍的
  # 規則,砍的是前兩條放行的那些 —— 實測逾時撤掉的單裡 **56% 撤單當下
  # 還在觸價上、邊際中位 6.36 bps**。
  #
  # **語意分界（核心原則 7）**:這一刻之前與之後的 maker.csv 在量不同的
  # 東西,任何成交率／時間到成交的統計不可以跨過 2026-09-15 10:2x。
  maker_timeout_sec: 60.0
  cancel_timeout_sec: 3.0
  # 0.25 -> 0.05（2026-09-14）。這是**邊際變壞之後我們多久才會發現**,
  # 而 2026-09-14 21:55 的那筆成交就死在這個窗口裡:
  #     21:55:02.186  cancelling — edge decayed to **-4.47** bps (floor +1.50)
  #     21:55:02.491  [QUOTE FILL] LIGHTER BUY 645/645 @0.02323  <- 305ms 後
  # 掛上去時邊際 +7.15,成交時 -4.47,實際 **-$0.0215**。引擎已經決定要撤,
  # 撤單還沒到就被打中 —— 而 250ms 的輪詢間隔是那個窗口的主要成分。
  #
  # **這個調整幾乎免費**:`LighterVenue.poll_order` 讀的是 WS 帳戶串流的
  # 快取,「There is deliberately no REST fallback here」,所以它不吃 REST
  # 配額（而 REST 配額正是今天每十分鐘斷線一次的原因,不可以再去碰它）。
  # 撤單重試的節奏不受影響:engine.py `cancel_backoff = max(base_poll, 0.5)`。
  # 引擎自己的下限也是 0.05,所以這是能設的最快值。
  maker_poll_sec: 0.05
  # 離 Lighter 觸價超過這麼多 bps 就撤單重掛（2026-09-14 新增的規則）。
  #
  # 為什麼需要它:送出時我們永遠在觸價上或更好,但掛著的期間簿口會跑掉 ——
  # 實測撤單時離觸價的 p90 是 8.66 bps,39.6% 的單在掛著期間變更遠。
  # 而**邊際規則結構上看不到這件事**:Lighter 簿口整體下移時,我們那張賣單
  # 越來越不可能成交,但它對 HL 的邊際反而變大。
  #
  # 值怎麼來的:MON 一個 tick = **4.30 bps**（0.00001 / 0.02338,候選裡最粗）。
  # 5.0 ≈ 1.2 個 tick,所以它在我們落後**兩個 tick 以上**時才動,不會因為
  # 一個 tick 的正常跳動就重掛（那會丟掉佇列位置又燒單量）。
  maker_reprice_bps: 5.0
  # **撤單門檻必須低於進場門檻**（upper_bps 3.0）,否則掛上去的下一個
  # tick 就被自己撤掉。取一半：邊際掉到剩一半就不值得繼續佔著那個價位。
  # 2026-09-14 之前這裡寫死 5.0 而帶是 15,看起來沒事；帶改成 3.0 之後
  # 5.0 就會變成「掛上即撤」—— 兩個數字是綁在一起的,不可以只改一個。
  maker_min_edge_bps: 1.5
  # **對沖先掛 post-only，沒成交才吃單**（2026-09-15 開啟，此前 0.0 = 直接吃）。
  #
  # 為什麼:逐筆分解 n=31（`tools/fill_decomp.py`，兩端的中價都取自掛單腿
  # 自己的逐檔錄製器）——
  #     賺到的半價差 +7.67   逆選擇 -4.01   ->   掛單腿淨 **+3.67 bps**
  # 而對沖腿要付 HL 吃單 4.50 ＋ 穿掉 HL 的半價差 0.65 = **5.15**
  #     => 每筆 **-1.48 bps**，與實際損益同號。
  # 改成掛單對沖:4.50 -> 1.50 且不穿價差 => **+2.17 bps**，符號翻正。
  # 費率階梯搆不到（`userFees`:VIP 一階 $5,000,000、做市商負費率日均
  # $28,202,011，我們累計 $695），所以這是唯一單獨能翻正符號的槓桿。
  #
  # **5 秒這個值是量出來的,不是猜的**:
  # (a) 逆選擇曲線（`tools/markout_curve.py`）從 t=5 秒到 t=120 秒是**平的**
  #     （-5.59 / -5.46 / -4.87 / -4.52 / -4.01 / -4.61），也就是說延後對沖
  #     **沒有可量到的漂移成本** —— 該跑的在成交那一瞬間就跑完了。
  # (b) HL 的 MON 約 1019 筆/小時，我們要的那一側約每 7 秒一筆，
  #     5 秒抓得到可觀的一部分,而且只試一次。
  # (c) 代價是 5 秒的裸曝險:同期無條件波動 2.17 bps x $15 = **$0.003** 的
  #     一個標準差,對上確定省下的 3.0 bps x $15 = **$0.0045**。
  #     前者零期望、後者確定,而部位小到可以在多筆之間分散掉。
  #
  # **逾時之後不撤單再吃單**:撤單確認 09-15 死鎖過兩次（74 分 + 81 分）,
  # 在報價腿上那是空轉,在對沖腿上是**裸著卡住**。掛單只試一次、撤單只送
  # 不等,殘餘交給既有的吃單路徑（那條只吃殘餘,重複執行是安全的）。
  hedge_maker_timeout_sec: 5.0
  premium_persist_sec: 2.0
  cooldown_sec: 0.0
  # 30 秒 ＋ 5 秒心跳：Lighter 的 feed 不會自己證明存活,而 staleness 比的是
  # alive_ts。實測沒有心跳時 24.6% 的訊框空檔超過 10 秒,GMX 因此十五分鐘
  # 就 HALT（TODO §1.41b）。
  staleness_sec: 30.0
  ws_ping_sec: 5.0
  reconcile_sec: 15.0
  settle_timeout_sec: 10.0
  leg_slippage_bps: 50.0
  hedge_slippage_bps: 20.0
  # 2 x 殘餘量子（1 顆）。對沖之後兩腿的殘差只能是量子的整數倍,
  # 所以小於一個量子的容忍值**永遠滿足不了**。
  net_tolerance_base: 2
  max_consecutive_errors: 3
  rate_limit_pause_sec: 10.0
  venue_probe_sec: 30.0
  # 2026-09-14：10.0 -> 50.0。**這條是 WAF 預算的最大單一消耗者。**
  #
  # 它唯一的工作是讓下單路徑的 TLS 連線不要斷,而連線池的
  # `keepalive_timeout` 是 **75 秒**（engine.py:210）。每 10 秒 ping 一次
  # 是需要的 7.5 倍 —— 每支引擎兩腿 6 req/分,七支 shadow 就是 84 req/分,
  # 而九支 record-only 加起來才 18（`_http_keepalive_loop` 只在
  # `not record_only` 時起）。
  #
  # 實測後果：2026-09-14 每十分鐘整,八支引擎在三十秒內全部被擋一次,
  # 每次 60 秒（`API recovered after 60s outage`）—— 10% 的時間不能交易,
  # 而它擋的是**重連**,那時引擎手上有部位。
  #
  # 50 秒留 25 秒餘裕（75 - 50）,足夠吸收一次丟包與重試,
  # 同時把消耗降到原本的 1/5。
  http_keepalive_sec: 50.0

risk:
  # **必須 < 一張單**（641.574 顆）：它擋的是「對沖完全失敗」,
  # 而那時 net 正好是一張單（engine.py:1478 —— _maybe_hedge 在報價結算後
  # 才查,立即對沖已經試過）。也要高過粉塵（1 顆）。
  # 這裡 = 0.25 張單 = 491.873 顆 = $11.50 = 492 個量子。
  max_net_base: 491.873
  # **裸曝險的時間維度**（2026-09-15 開啟，此前 0.0 = 一超過就 HALT）。
  #
  # 沒有它，上面的掛單對沖**結構上跑不起來**:一張單是 641.574 顆,
  # 而 max_net_base 是 491.873 —— 掛單對沖還在等成交的那幾秒,淨額必然
  # 超過水位,於是純水位的閘門必然 HALT。
  #
  # **不可以改成調大 max_net_base。** 那個值的用意是「一條腿卡住就跳」
  # （必須 < 一張單），調大它等於拆掉守衛本身（mistake.md 2026-09-14:
  # 一個把紅燈變綠的修法比原來的漏洞更危險）。要加的是**時間**不是**幅度**:
  # 短暫超過 = 對沖正在進行；**持續**超過 = 對沖真的失敗，那條照舊 HALT。
  #
  # 20 秒怎麼來的:掛單嘗試 5 秒 ＋ 撤單送出 ＋ 吃單往返（實測 quote-hedge
  # p50 **934 ms**）≈ 6-7 秒,留三倍餘裕吸收一次重試。而它仍然是**上限**:
  # 真的對沖失敗時，20 秒之內一定會 HALT。
  net_grace_sec: 20.0
  max_daily_loss_usd: 10.0
  max_gross_usd: 130
  # 單一市場紀律：第二個 live 行程會讓 account_budget.py 的 B3 變紅。
  max_account_gross_usd: 70.0
  min_account_free_usd: 25.0
  max_consecutive_stale: 20
  max_stale_episodes: 5
  halt_flatten_attempts: 3
  max_edge_bps: 300.0
  vol_window_sec: 60.0
  vol_max_move_bps: 300.0
  vol_cooldown_sec: 60.0
  unexplained_position_halt: true

control:
  # B5 控制通道。**沒有 Telegram 憑證時它照樣可用**：
  #     echo flat  > logs/MON/control.cmd     全平並保持暫停
  #     echo pause > logs/MON/control.cmd     停開新倉,對沖照跑
  # 每 2 秒輪詢,讀完即清空(殘留指令不會在重啟後再平一次倉)。
  # 它**不能**解除 HALT —— 解除 HALT 只能靠重啟,那是刻意的。
  #
  # **為什麼一定要逐配對(2026-09-14 翻 live 前查到的)**：預設值是
  # `control.cmd`,相對於 cwd,而這台機器上十幾個引擎的 cwd 全是 arb/engine,
  # 讀取端又是 `r+` 之後 truncate —— `echo flat > control.cmd` 會被**先搶到
  # 的那一個**吃掉,而真正在送單的那個拿到它的機率是 1/N。
  # 那不是一個需要的時候用得上的開關,而「需要的時候用得上」是它唯一的意義。
  command_file: logs/MON/control.cmd
  poll_sec: 2.0

logging:
  dashboard: false
  level: INFO
  file: logs/MON/engine.log
  trades_csv: logs/MON/trades.csv

recorder:
  enabled: true
  csv: logs/MON/minutes.csv
